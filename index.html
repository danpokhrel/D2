<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D2 project</title>
    <style>
    canvas {
      border: ridge black;
      border-width: 1vw;
      background-color: lightgrey;
      cursor: "pointer";
    }
    </style>
  </head>
  <body>
    <p>Left click to draw, right light to place stickers!</p>

    <div id="utilButtons">
      <button id="clearButton">Erase All</button>
      <button id="undoButton">Undo</button>
      <button id="redoButton">Redo</button>
      <button id="exportButton">Export PNG (2x)</button>
    </div>

    <div id="colorSettings">
      <p id="colorLabel">Current color: rAiNbOw</p>
      <div id="colorButtons"></div>
    </div>

    <div id="penSizeButtons">
      <button id="penSizeMinus">-</button>
      <input type="range" id="penSizeSlider" min="1" max="15"
        value="15" />
      <button id="penSizePlus">+</button>
      <label for="penSize" id="penSizeLabel">Pen Size</label>
    </div>

    <div id="stickerButtons">
      <button id="stickerSelectPrev">&#60;</button>
      <span id="stickerSelectLabel">:)</span>
      <button id="stickerSelectNext">&#62;</button>

      <button id="stickerSizeMinus">-</button>
      <input type="range" id="stickerSizeSlider" min="1" max="15"
        value="15" />
      <button id="stickerSizePlus">+</button>
      <label for="stickerSizeLabel" id="stickerSizeLabel">Sticker Size</label>
    </div>

    <canvas id="mainCanvas"></canvas>

    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
